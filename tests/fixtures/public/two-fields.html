<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Two date fields</title>
    <link rel="stylesheet" href="/fixture.css" />
  </head>
  <body>
    <main>
      <h1>Two date fields</h1>
      <p>Only the field that had focus when the shortcut ran may change.</p>
      <div class="field">
        <label for="start">Start date</label>
        <input id="start" name="startDate" placeholder="DD/MM/YYYY" value="15/03/2026" />
      </div>
      <div class="field">
        <label for="end">End date</label>
        <input id="end" name="endDate" placeholder="DD/MM/YYYY" value="20/03/2026" />
      </div>
    </main>
  </body>
</html>
