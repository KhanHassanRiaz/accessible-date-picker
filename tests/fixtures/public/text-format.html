<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Text field with a visible format</title>
    <link rel="stylesheet" href="/fixture.css" />
  </head>
  <body>
    <main>
      <h1>Text field with a visible format</h1>
      <p>There is no calendar. The placeholder says the format, so a direct write is safe.</p>
      <div class="field">
        <label for="booking">Booking date</label>
        <input
          id="booking"
          name="bookingDate"
          placeholder="DD/MM/YYYY"
          value="15/03/2026"
          autocomplete="off"
        />
      </div>
    </main>
  </body>
</html>
