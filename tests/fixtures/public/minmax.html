<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Native input with min and max</title>
    <link rel="stylesheet" href="/fixture.css" />
  </head>
  <body>
    <main>
      <h1>Native input with min and max</h1>
      <div class="field">
        <label for="booking">Booking date</label>
        <input
          id="booking"
          name="bookingDate"
          type="date"
          min="2026-01-10"
          max="2026-03-20"
          value="2026-02-10"
        />
      </div>
    </main>
  </body>
</html>
