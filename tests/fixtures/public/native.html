<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Native date inputs</title>
    <link rel="stylesheet" href="/fixture.css" />
  </head>
  <body>
    <main>
      <h1>Native date inputs</h1>
      <div class="field">
        <label for="appointment">Appointment date</label>
        <input id="appointment" name="appointment" type="date" value="2026-03-15" />
      </div>
      <div class="field">
        <label for="billing">Billing month</label>
        <input id="billing" name="billing" type="month" value="2026-03" />
      </div>
    </main>
  </body>
</html>
